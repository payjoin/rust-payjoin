name: Verify tag version
description: >
  Check that the pushed tag is the expected prefix followed by the version
  about to be published, refusing to publish on any mismatch. Tags carry
  the full `{version}+payjoin-{version}` string; when the packed version
  has no build metadata (npm, PyPI, and NuGet artifacts cannot carry it),
  the tag's metadata is stripped before comparing.
inputs:
  tag-prefix:
    description: Expected tag prefix, e.g. payjoin-ffi-
    required: true
  version:
    description: Version of the artifact or package about to be published
    required: true
  version-format:
    description: Version spelling used by the artifact, semver or python
    required: false
    default: semver
outputs:
  version:
    description: The version the tag calls for
    value: ${{ steps.check.outputs.version }}
runs:
  using: composite
  steps:
    - name: Compare tag against version
      id: check
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
        PREFIX: ${{ inputs.tag-prefix }}
        VERSION: ${{ inputs.version }}
        VERSION_FORMAT: ${{ inputs.version-format }}
      run: |
        set -euo pipefail
        if [[ $TAG != "$PREFIX"* ]]; then
          echo "::error::tag $TAG does not start with $PREFIX; refusing to publish"
          exit 1
        fi
        tag_version="${TAG#"$PREFIX"}"
        compare_version="$tag_version"
        # A packed version without build metadata comes from a registry
        # that cannot represent it, so the tag is compared with its
        # metadata stripped; a packed version that carries metadata must
        # match the tag exactly.
        if [[ $VERSION != *+* ]]; then
          compare_version="${tag_version%%+*}"
        fi
        case "${VERSION_FORMAT:-semver}" in
          semver) ;;
          python)
            compare_version="$(python3 contrib/release/bindings-version.py --python-version "$compare_version")"
            ;;
          *)
            echo "::error::unknown version format $VERSION_FORMAT"
            exit 1
            ;;
        esac
        if [[ $compare_version != "$VERSION" ]]; then
          echo "::error::tag $TAG implies version $compare_version but the packed version is $VERSION; refusing to publish"
          exit 1
        fi
        echo "version=$tag_version" >>"$GITHUB_OUTPUT"
