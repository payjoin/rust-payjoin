version: 2
updates:
  - package-ecosystem: uv
    cooldown:
      default-days: 7
    directory: "/payjoin-ffi/python"
    schedule:
      interval: weekly
    groups:
      uv:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directories:
      - "/.github/**"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
