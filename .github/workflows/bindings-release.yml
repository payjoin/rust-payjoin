name: Release language bindings

# Pushing a signed `payjoin-ffi-<version>` tag verifies the tag and the
# shared binding version, runs every language's build, package and smoke
# checks at that commit, then publishes Python, JavaScript, C#, and Dart
# through the `release` environment (required reviewer) with keyless OIDC
# and cuts one GitHub release holding every package.
#
# Each registry has its own publish job. All four wait on every language
# build, so they reach the environment gate together and one approval
# releases them all; a registry failure is retried with "Re-run failed
# jobs" on the same run, reusing the tested artifacts.

on:
  push:
    tags:
      - "payjoin-ffi-[0-9]*"

# Keep two attempts at the same tag from publishing concurrently.
concurrency:
  group: bindings-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch master
        run: git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
      - name: Set up nix
        uses: $/.github/actions/setup-nix
      - name: Verify tag hygiene
        env:
          TAG: ${{ github.ref_name }}
        run: nix --quiet develop .#release -c ./contrib/release/verify-tag-hygiene.sh "$TAG"
      - name: Verify every binding carries the tagged version
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(nix --quiet develop .#release -c ./contrib/release/bindings-version.sh --tag "$TAG")"
          nix --quiet develop .#release -c ./contrib/release/check-invariants.sh payjoin-ffi
          source contrib/release/crates.sh
          {
            echo "version=$version"
            is_prerelease "$version" && echo "prerelease=true" || echo "prerelease=false"
          } >>"$GITHUB_OUTPUT"
      - name: Verify the wrapped payjoin core is on crates.io
        run: |
          set -euo pipefail
          source contrib/release/crates.sh
          core="$(nix --quiet develop .#release -c bash -c 'source contrib/release/crates.sh && manifest_version payjoin')"
          # Dart consumers build the bindings from source against it.
          crate_published payjoin "$core" || {
            echo "::error::payjoin $core is not on crates.io; publish it before the bindings"
            exit 1
          }

  python:
    needs: verify-tag
    uses: $/.github/workflows/python.yml
  javascript:
    needs: verify-tag
    uses: $/.github/workflows/javascript.yml
  csharp:
    needs: verify-tag
    uses: $/.github/workflows/csharp.yml
  dart:
    needs: verify-tag
    uses: $/.github/workflows/dart.yml
  kotlin:
    needs: verify-tag
    uses: $/.github/workflows/kotlin.yml

  publish-python:
    name: Publish to PyPI
    needs: [python, javascript, csharp, dart, kotlin]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      id-token: write # OIDC: PyPI trusted publishing and its PEP 740 attestations
      attestations: write # actions/attest-build-provenance writes the attestation
    steps:
      - name: Download wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: payjoin-python-wheel-*
          merge-multiple: true
          path: dist
      - name: Check both wheels are present
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/payjoin-*.whl)
          if [ "${#pkgs[@]}" -ne 2 ]; then
            echo "::error::expected exactly two wheels in dist/, found ${#pkgs[@]}: ${pkgs[*]:-none}"
            exit 1
          fi
      - name: Attest build provenance
        # A consumer runs: gh attestation verify <file>.whl -R payjoin/rust-payjoin
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.whl
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  publish-javascript:
    name: Publish to npmjs.com
    needs: [verify-tag, python, javascript, csharp, dart, kotlin]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      id-token: write # OIDC: npm trusted publishing and its provenance statement
      attestations: write # actions/attest writes the attestation
    steps:
      - name: Download npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payjoin-javascript-npm-package
          path: dist
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24" # ships npm 11, needed for OIDC trusted publishing
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # publishing workflow: cache would be poisonable
      - name: Locate the tarball
        id: locate
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/payjoin-*.tgz)
          if [ "${#pkgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .tgz in dist/, found ${#pkgs[@]}: ${pkgs[*]:-none}"
            exit 1
          fi
          echo "tarball=${pkgs[0]}" >>"$GITHUB_OUTPUT"
      - name: Attest build provenance
        # A consumer runs: gh attestation verify <file>.tgz -R payjoin/rust-payjoin
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.locate.outputs.tarball }}
      - name: Publish to npmjs.com
        env:
          TARBALL: ${{ steps.locate.outputs.tarball }}
          # Pre-releases go to the `next` dist-tag so `npm install payjoin`
          # keeps resolving the latest stable version.
          CHANNEL: ${{ needs.verify-tag.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm publish "./$TARBALL" --tag "$CHANNEL"

  publish-csharp:
    name: Publish to nuget.org
    needs: [python, javascript, csharp, dart, kotlin]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      id-token: write # OIDC: used by both NuGet/login and actions/attest
      attestations: write # actions/attest writes the attestation
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payjoin-csharp-nuget-package
          path: dist
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Locate the package
        id: locate
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/*.nupkg)
          if [ "${#pkgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .nupkg in dist/, found ${#pkgs[@]}: ${pkgs[*]:-none}"
            exit 1
          fi
          echo "nupkg=${pkgs[0]}" >>"$GITHUB_OUTPUT"
      - name: Attest build provenance
        # Attesting the .nupkg covers every RID native lib inside it; a consumer
        # runs: gh attestation verify <file>.nupkg -R payjoin/rust-payjoin
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.locate.outputs.nupkg }}
      - name: NuGet login (OIDC -> short-lived API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUPKG: ${{ steps.locate.outputs.nupkg }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$NUPKG" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --skip-duplicate

  publish-dart:
    name: Publish to pub.dev
    needs: [python, javascript, csharp, dart, kotlin]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      id-token: write # OIDC: pub.dev automated publishing
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up nix
        uses: $/.github/actions/setup-nix
      - name: Download the staged package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payjoin-dart-pub-package
          path: dist
      - name: Extract the staged package
        run: |
          mkdir -p "$RUNNER_TEMP/payjoin-pub"
          tar -xzf dist/payjoin-dart.tar.gz -C "$RUNNER_TEMP/payjoin-pub"
      - name: Publish to pub.dev
        run: nix develop .#dart -c ./payjoin-ffi/dart/contrib/publish.sh "$RUNNER_TEMP/payjoin-pub"

  github-release:
    name: Create GitHub release
    needs:
      [
        verify-tag,
        publish-python,
        publish-javascript,
        publish-csharp,
        publish-dart,
      ]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the Release for this tag and upload assets
    env:
      VERSION: ${{ needs.verify-tag.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download every package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: payjoin-*
          merge-multiple: true
          path: dist
      - name: Check the asset set is complete
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          npm=(dist/*.tgz)
          nuget=(dist/*.nupkg)
          if [[ ${#wheels[@]} != 2 || ${#npm[@]} != 1 || ${#nuget[@]} != 1 || ! -f dist/payjoin-dart.tar.gz ]]; then
            echo "::error::expected two wheels, one npm tarball, one NuGet package, and the Dart archive in dist/"
            ls dist
            exit 1
          fi
      - name: Generate SHA256SUMS
        # The NuGet package's native libraries are listed individually so
        # each can be verified on its own. A maintainer's GPG signature over
        # SHA256SUMS is made locally and uploaded as SHA256SUMS.asc; no
        # signing key reaches a runner.
        env:
          ARCHIVE_GLOBS: "*.nupkg"
          MEMBER_GLOBS: runtimes/*/native/*
        run: |
          ./contrib/release/generate-sha256sums.sh dist
          cat dist/SHA256SUMS
      - name: Extract changelog section
        id: changelog
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            ./contrib/release/extract-changelog.sh payjoin-ffi "$VERSION"
            echo "CHANGELOG_EOF"
          } >>"$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$BODY" >"$notes"
          args=(--title "Release $TAG" --notes-file "$notes")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          # A re-run after a partial failure edits the release that already
          # exists and re-uploads its assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${args[@]}"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" "${args[@]}" dist/*
          fi
