name: Build and Test CSharp
on:
  workflow_run:
    workflows: ["Flake maintenance"]
    types: [requested]
    branches:
      - "update_flake_lock_action"
  pull_request:
    paths:
      - payjoin-ffi/**
      # The unix jobs run inside the flake's csharp dev shell, so changes to
      # the flake change this workflow's environment.
      - flake.nix
      - flake.lock
  # Publishing path. A tag push runs the full build/pack/smoke graph at the
  # tagged commit (no path filter applies to tags), then the tag-gated
  # publish/release jobs below. Tag scheme: payjoin-csharp-<csproj Version>,
  # e.g. payjoin-csharp-0.24.0-preview.1. The [0-9] anchor keeps this glob
  # collision-free against the repo's existing payjoin-* and payjoin-cli-*
  # tags (which a payjoin-csharp-* prefix cannot match anyway) while dropping
  # the `v` so the scheme matches the version-first convention already in use.
  push:
    tags:
      - "payjoin-csharp-[0-9]*"

jobs:
  build-csharp-and-test-unix:
    name: "Build and test csharp"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Use cache"
        uses: Swatinem/rust-cache@v2
      - name: "Install nix"
        uses: DeterminateSystems/determinate-nix-action@main
      - name: "Use nix cache"
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: "Build and test"
        run: nix develop .#csharp -c ./payjoin-ffi/csharp/contrib/test.sh

  build-csharp-and-test-windows:
    name: "Build and test csharp (windows)"
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85
    defaults:
      run:
        working-directory: payjoin-ffi/csharp
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Generate bindings and binaries
        shell: pwsh
        run: ./scripts/generate_bindings.ps1

      - name: Run tests
        run: dotnet test Payjoin.Tests.csproj --logger "console;verbosity=minimal"

  build-nuget-native:
    # Every RID cross-compiles from Linux: cargo-zigbuild links the Linux targets
    # against a pinned glibc floor and the macOS targets against zig's bundled
    # libSystem stubs; cargo-xwin links MSVC-ABI Windows targets against the
    # Microsoft CRT/SDK. The per-RID smoke jobs verify each produced asset on
    # real hardware.
    name: "Build NuGet native asset"
    runs-on: ubuntu-latest
    env:
      # Must match the dtolnay/rust-toolchain version exactly: the cross-target
      # std components are installed for that toolchain, and a partial version
      # here selects a different rustup toolchain entry without them (E0463).
      RUSTUP_TOOLCHAIN: 1.85.0
    defaults:
      run:
        working-directory: payjoin-ffi/csharp
    strategy:
      # Let every RID report its own result; a failure in one target should not
      # cancel the signal from the others.
      fail-fast: false
      matrix:
        include:
          - rid: linux-arm64
            target: aarch64-unknown-linux-gnu
          - rid: linux-x64
            target: x86_64-unknown-linux-gnu
          - rid: osx-arm64
            target: aarch64-apple-darwin
          - rid: osx-x64
            target: x86_64-apple-darwin
          - rid: win-arm64
            target: aarch64-pc-windows-msvc
          - rid: win-x64
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross toolchain
        # Version- and hash-pinned: these tools produce the shipped binaries.
        run: pip install --require-hashes -r scripts/cross-requirements.txt

      - name: Install MSVC toolchain frontends (clang-cl, llvm-lib)
        if: startsWith(matrix.rid, 'win-')
        # cargo-xwin compiles C dependencies with clang-cl and archives them with
        # llvm-lib. The runner image ships LLVM with versioned binary names only,
        # so expose the unversioned names cc-rs looks for.
        run: |
          for tool in clang-cl llvm-lib; do
            if command -v "$tool" >/dev/null; then
              continue
            fi
            latest=$(ls -1 /usr/bin/"$tool"-* 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$latest" ]; then
              sudo apt-get update -q
              sudo apt-get install -y -q llvm clang
              latest=$(ls -1 /usr/bin/"$tool"-* 2>/dev/null | sort -V | tail -n 1)
            fi
            if [ -z "$latest" ]; then
              echo "$tool not found on the runner" >&2
              exit 1
            fi
            sudo ln -s "$latest" /usr/local/bin/"$tool"
          done
          command -v clang-cl llvm-lib

      - name: Build release native asset
        run: |
          PAYJOIN_FFI_CROSS=1 PAYJOIN_FFI_RID=${{ matrix.rid }} bash ./scripts/build_nuget_native.sh

      - name: Upload NuGet native asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: payjoin-ffi/csharp/artifacts/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  pack-nuget:
    name: "Pack C# NuGet package"
    runs-on: ubuntu-latest
    needs: build-nuget-native
    env:
      # Exact version so the packaged bindings build with the toolchain the
      # action installs, not an implicitly-installed latest 1.85.x.
      RUSTUP_TOOLCHAIN: 1.85.0
    defaults:
      run:
        working-directory: payjoin-ffi/csharp
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Use cache
        uses: Swatinem/rust-cache@v2

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download native assets
        uses: actions/download-artifact@v4
        with:
          path: payjoin-ffi/csharp/artifacts/downloaded

      - name: Assemble RID assets
        run: |
          for rid in linux-arm64 linux-x64 osx-arm64 osx-x64 win-arm64 win-x64; do
            mkdir -p "artifacts/runtimes/$rid/native"
            cp "artifacts/downloaded/$rid"/* "artifacts/runtimes/$rid/native/"
          done

      - name: Generate production bindings
        run: |
          PAYJOIN_FFI_FEATURES= PAYJOIN_FFI_PROFILE=release bash ./scripts/generate_bindings.sh

      - name: Pack NuGet package
        run: dotnet pack Payjoin.csproj --configuration Release --output artifacts/packages

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: payjoin-csharp-nuget-package
          path: payjoin-ffi/csharp/artifacts/packages/*.nupkg
          if-no-files-found: error

  smoke-nuget:
    name: "Smoke test C# NuGet package"
    runs-on: ${{ matrix.os }}
    needs: pack-nuget
    defaults:
      run:
        working-directory: payjoin-ffi/csharp
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: payjoin-csharp-nuget-package
          path: payjoin-ffi/csharp/artifacts/packages

      - name: Run package smoke test
        shell: bash
        # 'auto' derives the version from the packed artifact, so Payjoin.csproj
        # stays the only place the package version is maintained.
        run: bash ./scripts/smoke_nuget_package.sh artifacts/packages auto ${{ matrix.rid }}

  # ---------------------------------------------------------------------------
  # PUBLISH PATH (tag-gated). Runs only for a payjoin-csharp-* tag push, after
  # pack + every per-RID smoke job are green. Consumes the already-built,
  # already-smoke-tested `payjoin-csharp-nuget-package` artifact — never repacks.
  # ---------------------------------------------------------------------------
  publish-nuget:
    name: "Publish to nuget.org (trusted publishing / OIDC)"
    runs-on: ubuntu-latest
    needs: [pack-nuget, smoke-nuget]
    if: startsWith(github.ref, 'refs/tags/payjoin-csharp-')
    # Optional but recommended: a GitHub Actions environment lets you bind the
    # nuget.org policy to `nuget-release` AND add required reviewers, turning
    # publish into a manual-approval gate. Create the environment first, or
    # remove this line to publish without an approval gate. See README.
    environment: nuget-release
    permissions:
      id-token: write # OIDC: used by BOTH NuGet/login and attest-build-provenance
      attestations: write # actions/attest-build-provenance writes the attestation
      contents: read # checkout of the (already-packed) repo is not needed; read is the floor
    steps:
      - name: Download packed NuGet package
        uses: actions/download-artifact@v4
        with:
          name: payjoin-csharp-nuget-package
          path: dist

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify tag matches packed artifact version
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          # payjoin-csharp-0.24.0-preview.1 -> 0.24.0-preview.1
          version="${GITHUB_REF_NAME#payjoin-csharp-}"
          shopt -s nullglob
          pkgs=(dist/*.nupkg)
          if [ "${#pkgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .nupkg in dist/, found ${#pkgs[@]}: ${pkgs[*]:-none}"
            exit 1
          fi
          expected="Payjoin.${version}.nupkg"
          actual="$(basename "${pkgs[0]}")"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies ${expected} but packed artifact is ${actual}; refusing to publish"
            exit 1
          fi
          echo "nupkg=${pkgs[0]}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (nupkg)
        # Attesting the .nupkg covers every RID native lib inside it; a consumer
        # runs: gh attestation verify <file>.nupkg -R payjoin/rust-payjoin
        # (To attest each native .so/.dylib/.dll as an independent subject as
        #  well, add a second attest step with subject-checksums pointing at the
        #  SHA256SUMS produced in github-release. Not required — the nupkg is the
        #  published unit.)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.verify.outputs.nupkg }}

      - name: NuGet login (OIDC -> short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org username (profile name), NOT an email. Individual member of
          # the org that owns the Trusted Publishing policy. Kept in a secret only
          # to avoid leaking the account name in logs — it is NOT a credential;
          # there is no long-lived API key anywhere in this workflow.
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          # --skip-duplicate keeps re-runs idempotent: if a prior run published
          # this version but a later job (github-release) failed, re-triggering
          # the tag would otherwise 409 on the already-published version and
          # redden the whole run. With it, an already-present version is a
          # no-op success and the run converges.
          dotnet nuget push "${{ steps.verify.outputs.nupkg }}" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --skip-duplicate

  github-release:
    name: "Attach nupkg + SHA256SUMS to the GitHub release"
    runs-on: ubuntu-latest
    needs: [publish-nuget]
    if: startsWith(github.ref, 'refs/tags/payjoin-csharp-')
    permissions:
      contents: write # create/update the Release for this tag and upload assets
    steps:
      - name: Download packed NuGet package
        uses: actions/download-artifact@v4
        with:
          name: payjoin-csharp-nuget-package
          path: dist

      - name: Generate SHA256SUMS (nupkg + each native lib)
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          # Hash the package itself.
          sha256sum *.nupkg > SHA256SUMS
          # Also hash each shipped native library extracted from inside the
          # package, so a consumer can verify an individual .so/.dylib/.dll
          # (paths are runtimes/<rid>/native/<lib>). Matches the tor/hwi pattern.
          tmp="$(mktemp -d)"
          unzip -q *.nupkg -d "$tmp" 'runtimes/*/native/*'
          ( cd "$tmp" && find runtimes -type f -print0 | sort -z | xargs -0 sha256sum ) >> SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.nupkg
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          # Mark preview / rc tags as pre-releases on the Releases page.
          prerelease: ${{ contains(github.ref_name, '-preview') || contains(github.ref_name, '-rc') }}
          # Dan's GPG detached signature over SHA256SUMS is added out-of-band
          # (locally, then uploaded as SHA256SUMS.asc) — his private key must not
          # live on a runner. See README "GPG signature".
