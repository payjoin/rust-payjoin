name: Build and Test CSharp
on:
  workflow_call:
  pull_request:
    paths:
      - payjoin-ffi/**
      # The unix jobs run inside the flake's csharp dev shell, so changes to
      # the flake change this workflow's environment.
      - flake.nix
      - flake.lock
  push:
    tags:
      - "payjoin-csharp-[0-9]*"

permissions:
  contents: read

jobs:
  build-csharp-and-test-unix:
    name: "Build and test csharp"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: "Install Rust 1.85.0"
        uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
      - name: "Use cache"
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          shared-key: msrv-workspace
      - name: Set up nix
        uses: $/.github/actions/setup-nix
      - name: "Build and test"
        run: nix develop .#csharp -c ./payjoin-ffi/csharp/contrib/test.sh

  build-csharp-and-test-windows:
    name: "Build and test csharp (windows)"
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85
    defaults:
      run:
        working-directory: payjoin-ffi/csharp
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0

      - name: Use cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Verify .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Generate bindings and binaries
        shell: pwsh
        run: ./scripts/generate_bindings.ps1

      - name: Run tests
        run: dotnet test Payjoin.Tests.csproj --logger "console;verbosity=minimal"

  build-nuget-native:
    # Every RID cross-compiles from Linux: cargo-zigbuild links the Linux targets
    # against a pinned glibc floor and the macOS targets against zig's bundled
    # libSystem stubs; cargo-xwin links MSVC-ABI Windows targets against the
    # Microsoft CRT/SDK. The per-RID smoke jobs verify each produced asset on
    # real hardware.
    name: "Build NuGet native asset"
    runs-on: ubuntu-26.04
    env:
      # Must match the dtolnay/rust-toolchain version exactly: the cross-target
      # std components are installed for that toolchain, and a partial version
      # here selects a different rustup toolchain entry without them (E0463).
      RUSTUP_TOOLCHAIN: 1.85.0
    defaults:
      run:
        working-directory: payjoin-ffi/csharp
    strategy:
      # Let every RID report its own result; a failure in one target should not
      # cancel the signal from the others.
      fail-fast: false
      matrix:
        include:
          - rid: linux-arm64
            target: aarch64-unknown-linux-gnu
          - rid: linux-x64
            target: x86_64-unknown-linux-gnu
          - rid: osx-arm64
            target: aarch64-apple-darwin
          - rid: osx-x64
            target: x86_64-apple-darwin
          - rid: win-arm64
            target: aarch64-pc-windows-msvc
          - rid: win-x64
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Use cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Install cross toolchain
        # Version- and hash-pinned: these tools produce the shipped binaries.
        run: pip install --require-hashes -r scripts/cross-requirements.txt

      - name: Install MSVC toolchain frontends (clang-cl, llvm-lib)
        if: startsWith(matrix.rid, 'win-')
        # cargo-xwin compiles C dependencies with clang-cl and archives them with
        # llvm-lib. The runner image ships LLVM with versioned binary names only,
        # so expose the unversioned names cc-rs looks for.
        run: |
          for tool in clang-cl llvm-lib; do
            if command -v "$tool" >/dev/null; then
              continue
            fi
            latest=$(ls -1 /usr/bin/"$tool"-* 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$latest" ]; then
              sudo apt-get update -q
              sudo apt-get install -y -q llvm clang
              latest=$(ls -1 /usr/bin/"$tool"-* 2>/dev/null | sort -V | tail -n 1)
            fi
            if [ -z "$latest" ]; then
              echo "$tool not found on the runner" >&2
              exit 1
            fi
            sudo ln -s "$latest" /usr/local/bin/"$tool"
          done
          command -v clang-cl llvm-lib

      - name: Build release native asset
        run: |
          PAYJOIN_FFI_CROSS=1 PAYJOIN_FFI_RID=${{ matrix.rid }} bash ./scripts/build_nuget_native.sh

      - name: Upload NuGet native asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.rid }}
          path: payjoin-ffi/csharp/artifacts/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  pack-nuget:
    name: "Pack C# NuGet package"
    runs-on: ubuntu-26.04
    needs: build-nuget-native
    env:
      # Exact version so the packaged bindings build with the toolchain the
      # action installs, not an implicitly-installed latest 1.85.x.
      RUSTUP_TOOLCHAIN: 1.85.0
    defaults:
      run:
        working-directory: payjoin-ffi/csharp
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout

      - name: Install Rust 1.85.0
        uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22 # 1.85.0

      - name: Use cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Download native assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: payjoin-ffi/csharp/artifacts/downloaded

      - name: Assemble RID assets
        run: |
          for rid in linux-arm64 linux-x64 osx-arm64 osx-x64 win-arm64 win-x64; do
            mkdir -p "artifacts/runtimes/$rid/native"
            cp "artifacts/downloaded/$rid"/* "artifacts/runtimes/$rid/native/"
          done

      - name: Generate production bindings
        run: |
          PAYJOIN_FFI_FEATURES= PAYJOIN_FFI_PROFILE=release bash ./scripts/generate_bindings.sh

      - name: Pack NuGet package
        run: dotnet pack Payjoin.csproj --configuration Release --output artifacts/packages

      - name: Upload NuGet package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payjoin-csharp-nuget-package
          path: payjoin-ffi/csharp/artifacts/packages/*.nupkg
          if-no-files-found: error

  smoke-nuget:
    name: "Smoke test C# NuGet package"
    runs-on: ${{ matrix.os }}
    needs: pack-nuget
    defaults:
      run:
        working-directory: payjoin-ffi/csharp
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04-arm
            rid: linux-arm64
          - os: ubuntu-26.04
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Download NuGet package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payjoin-csharp-nuget-package
          path: payjoin-ffi/csharp/artifacts/packages

      - name: Run package smoke test
        shell: bash
        # 'auto' derives the version from the packed artifact, so Payjoin.csproj
        # stays the only place the package version is maintained.
        run: bash ./scripts/smoke_nuget_package.sh artifacts/packages auto ${{ matrix.rid }}

  verify-tag:
    name: "Verify release tag"
    if: startsWith(github.ref, 'refs/tags/payjoin-csharp-')
    permissions:
      contents: read
    uses: $/.github/workflows/verify-tag-hygiene.yml

  publish-nuget:
    name: "Publish to nuget.org (trusted publishing / OIDC)"
    runs-on: ubuntu-latest
    needs: [pack-nuget, smoke-nuget, verify-tag]
    if: startsWith(github.ref, 'refs/tags/payjoin-csharp-')
    environment: release
    permissions:
      id-token: write # OIDC: used by BOTH NuGet/login and actions/attest
      attestations: write # actions/attest writes the attestation
      contents: read # needed only to check out the in-repo verify-tag-version action
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout

      - name: Download packed NuGet package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payjoin-csharp-nuget-package
          path: dist

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Locate packed artifact
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(dist/*.nupkg)
          if [ "${#pkgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .nupkg in dist/, found ${#pkgs[@]}: ${pkgs[*]:-none}"
            exit 1
          fi
          # Payjoin.0.24.0-preview.1.nupkg -> 0.24.0-preview.1
          name="$(basename "${pkgs[0]}" .nupkg)"
          echo "nupkg=${pkgs[0]}" >> "$GITHUB_OUTPUT"
          echo "version=${name#Payjoin.}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches packed artifact version
        id: verify
        uses: $/.github/actions/verify-tag-version
        with:
          tag-prefix: payjoin-csharp-
          version: ${{ steps.locate.outputs.version }}

      - name: Attest build provenance (nupkg)
        # Attesting the .nupkg covers every RID native lib inside it; a consumer
        # runs: gh attestation verify <file>.nupkg -R payjoin/rust-payjoin
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.locate.outputs.nupkg }}

      - name: NuGet login (OIDC -> short-lived API key)
        id: login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUPKG: ${{ steps.locate.outputs.nupkg }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$NUPKG" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols \
            --skip-duplicate

  github-release:
    name: "Attach nupkg + SHA256SUMS to the GitHub release"
    needs: [publish-nuget]
    if: startsWith(github.ref, 'refs/tags/payjoin-csharp-')
    permissions:
      contents: write # create/update the Release for this tag and upload assets
    uses: $/.github/workflows/release-assets.yml
    with:
      artifact-pattern: payjoin-csharp-nuget-package
      tag-prefix: payjoin-csharp-
      archive-globs: "*.nupkg"
      archive-member-globs: runtimes/*/native/*
