name: Build and Test Dart
on:
  workflow_run:
    workflows: ["Flake maintenance"]
    types: [requested]
    branches:
      - "update_flake_lock_action"
  pull_request:
    paths:
      - payjoin-ffi/**
      # The jobs run inside the flake's dev shell, so changes to the flake
      # change this workflow's environment.
      - flake.nix
      - flake.lock
      - Cargo-minimal.lock
      - Cargo-recent.lock
      - contrib/release/**
      - .github/actions/**
      - .github/workflows/dart.yml
      - .github/workflows/verify-tag-hygiene.yml
      - .github/workflows/release-assets.yml
      - .github/workflows/bindings-release.yml
  workflow_call:

jobs:
  build-dart-and-test:
    name: "Build and test dart"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Install Rust 1.85.0"
        uses: dtolnay/rust-toolchain@1.85.0
      - name: "Use cache"
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-workspace
      - name: Set up nix
        uses: ./.github/actions/setup-nix
      - name: "Build and test"
        run: nix develop .#dart -c bash ./payjoin-ffi/dart/contrib/test.sh

  verify-pub-package:
    name: "Verify pub.dev package"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Use cache"
        uses: Swatinem/rust-cache@v2
      - name: Set up nix
        uses: ./.github/actions/setup-nix
      - name: Generate production bindings and dry-run publish
        run: nix develop .#dart -c ./payjoin-ffi/dart/contrib/prepare-publish.sh "$RUNNER_TEMP/payjoin-pub"

      - name: Archive staged release package
        if: startsWith(github.ref, 'refs/tags/payjoin-ffi-')
        run: tar -czf "$RUNNER_TEMP/payjoin-dart.tar.gz" -C "$RUNNER_TEMP/payjoin-pub" .
      - name: Upload staged release package
        if: startsWith(github.ref, 'refs/tags/payjoin-ffi-')
        uses: actions/upload-artifact@v4
        with:
          name: payjoin-dart-pub-package
          path: ${{ runner.temp }}/payjoin-dart.tar.gz
          if-no-files-found: error
