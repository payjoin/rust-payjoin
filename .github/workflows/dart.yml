name: Build and Test Dart
on:
  workflow_call:
  pull_request:
    paths:
      - payjoin-ffi/**
      # The jobs run inside the flake's dev shell, so changes to the flake
      # change this workflow's environment.
      - flake.nix
      - flake.lock

permissions:
  contents: read

jobs:
  build-dart-and-test:
    name: "Build and test dart"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: "Install Rust 1.85.0"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.85.0
      - name: "Use cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          shared-key: msrv-workspace
      - name: Set up nix
        uses: $/.github/actions/setup-nix
      - name: "Build and test"
        run: nix develop .#dart -c bash ./payjoin-ffi/dart/contrib/test.sh

  verify-pub-package:
    name: "Verify pub.dev package"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: "Use cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Set up nix
        uses: $/.github/actions/setup-nix
      - name: Generate production bindings and dry-run publish
        run: |
          # A release tag stages payjoin and payjoin-mailroom against
          # crates.io, as consumers build them. Any other run may wrap
          # changes to those crates that are not published yet, so it
          # stages them from the checkout.
          flags=()
          if [[ $GITHUB_REF != refs/tags/* ]]; then
            flags+=(--core-from-revision)
          fi
          nix develop .#dart -c ./payjoin-ffi/dart/contrib/prepare-publish.sh "${flags[@]}" "$RUNNER_TEMP/payjoin-pub"
      # The release workflow publishes this exact stage, so it is archived
      # rather than regenerated in the publish job.
      - name: Archive the staged package
        run: tar -czf "$RUNNER_TEMP/payjoin-dart.tar.gz" -C "$RUNNER_TEMP/payjoin-pub" .
      - name: Upload the staged package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payjoin-dart-pub-package
          path: ${{ runner.temp }}/payjoin-dart.tar.gz
          if-no-files-found: error

  # Build the staged package twice the way a consumer would and require
  # byte-identical native libraries. The two builds differ in every path
  # the hook remaps: package root, app directory, and the HOME that holds
  # the Cargo, rustup and pub caches.
  reproducible-linux:
    name: "Reproduce the Linux native library"
    needs: verify-pub-package
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: Download the staged package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payjoin-dart-pub-package
          path: dist
      - name: Extract the staged package
        run: |
          mkdir -p "$RUNNER_TEMP/stage"
          tar -xzf dist/payjoin-dart.tar.gz -C "$RUNNER_TEMP/stage"
      - name: "Install rustup"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.85.1
      # Flutter 3.44.9 bundles the Dart SDK Bull Bitcoin builds with.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.9
      - name: Build the consumer twice and compare the libraries
        run: |
          set -euo pipefail
          # The space checks that the hook keeps such paths in one flag.
          for build in first "second/with space"; do
            root="$RUNNER_TEMP/linux/$build"
            mkdir -p "$root/home"
            # The runner image exports CARGO_HOME and RUSTUP_HOME, which
            # hooks_runner withholds from the hook, so the hook uses the
            # defaults under HOME. Point both there so the toolchain
            # installed here is the one the hook finds.
            export HOME="$root/home" CARGO_HOME="$root/home/.cargo" \
              RUSTUP_HOME="$root/home/.rustup" PUB_CACHE="$root/home/.pub-cache"
            rustup toolchain install 1.85.1 --profile minimal
            cp -a "$RUNNER_TEMP/stage" "$root/payjoin"
            cp -a payjoin-ffi/dart/contrib/consumer "$root/app"
            (cd "$root/app" && dart pub get && dart run bin/main.dart)
          done
          # Cargo leaves a second copy under release/deps, which is not
          # the hook's output.
          library() {
            find "$RUNNER_TEMP/linux/$1/app/.dart_tool" -type f \
              -path '*/x86_64-unknown-linux-gnu/release/libpayjoin_ffi_wrapper.so'
          }
          cmp "$(library first)" "$(library "second/with space")"
