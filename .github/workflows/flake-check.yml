name: Flake Check

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "flake.lock"

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        checks:
          - msrv
          - stable
          - nightly
          - maintenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Run full flake check
        run: nix build .#checks.x86_64-linux.${{ matrix.checks }}
