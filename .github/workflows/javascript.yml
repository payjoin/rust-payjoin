name: Build and Test JavaScript
on:
  workflow_call:
  pull_request:
    paths:
      - payjoin-ffi/**
      # The jobs run inside the flake's dev shell, so changes to the flake
      # change this workflow's environment.
      - flake.nix
      - flake.lock

permissions:
  contents: read

jobs:
  build-js-and-test:
    name: "Build and test javascript"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: "Install Rust 1.85.0"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.85.0
      - name: "Use cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
          shared-key: msrv-workspace
      - name: Set up nix
        uses: $/.github/actions/setup-nix
      - name: "Build and test"
        run: nix develop .#javascript -c ./payjoin-ffi/javascript/contrib/test.sh

  pack-npm:
    # The package ships only dist/ (wasm + compiled TypeScript), which is
    # platform-independent, so one pack on Linux is the entire release build.
    name: "Pack npm package"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: "Use cache"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Set up nix
        uses: $/.github/actions/setup-nix
      - name: Build and pack
        run: nix develop .#javascript -c ./payjoin-ffi/javascript/contrib/pack.sh
      - name: Upload npm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payjoin-javascript-npm-package
          path: payjoin-ffi/javascript/artifacts/*.tgz
          if-no-files-found: error

  smoke-npm:
    name: "Smoke test npm package"
    runs-on: ${{ matrix.os }}
    needs: pack-npm
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: Download npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payjoin-javascript-npm-package
          path: payjoin-ffi/javascript/smoke/pkg
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install and exercise the packed package
        shell: bash
        run: |
          set -euo pipefail
          cd payjoin-ffi/javascript/smoke
          # The lockfile pins a stable tarball path so the artifact's
          # version-named file must be renamed to match it.
          shopt -s nullglob
          tarballs=(pkg/payjoin-*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .tgz in pkg/, found ${#tarballs[@]}: ${tarballs[*]:-none}"
            exit 1
          fi
          mv "${tarballs[0]}" pkg/payjoin.tgz
          # Installs payjoin and its dependencies from the committed
          # lockfile, so nothing is ever installed ad-hoc.
          npm ci
          node --input-type=module -e '
            import { payjoin, uniffiInitAsync } from "payjoin";
            await uniffiInitAsync();
            payjoin.Url.parse("https://example.com");
            console.log("smoke ok");
          '
