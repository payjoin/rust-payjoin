name: Build and Test JavaScript
on:
  workflow_run:
    workflows: ["Flake maintenance"]
    types: [requested]
    branches:
      - "update_flake_lock_action"
  pull_request:
    paths:
      - payjoin-ffi/**
      # The jobs run inside the flake's dev shell, so changes to the flake
      # change this workflow's environment.
      - flake.nix
      - flake.lock
      # This is the only workflow that compiles for wasm32-unknown-unknown,
      # and the wasm build pulls in the core crates via payjoin-ffi's
      # `wasm_js` feature (-> `getrandom/js`), which is what supplies
      # browser entropy for the input/output shuffle in
      # payjoin/src/core/receive/common/mod.rs. A dependency bump can drop
      # that backend without touching payjoin-ffi/, so gate on the
      # manifests and the lockfile as well.
      - "**/Cargo.toml"
      - Cargo.lock

jobs:
  build-js-and-test:
    name: "Build and test javascript"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: "Use cache"
        uses: Swatinem/rust-cache@v2
      - name: "Install nix"
        uses: DeterminateSystems/determinate-nix-action@main
      - name: "Use nix cache"
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: "Build and test"
        run: nix develop .#javascript -c ./payjoin-ffi/javascript/contrib/test.sh
