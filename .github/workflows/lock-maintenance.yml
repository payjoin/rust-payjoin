name: Cargo lock maintenance
on:
  schedule:
    - cron: "0 20 * * 0" # weekly at 20:00 UTC
  workflow_dispatch:

jobs:
  update-lock-files:
    runs-on: ubuntu-26.04
    env:
      UPDATE_DEPS: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - run: bash contrib/update-lock-files.sh
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          title: "chore: update cargo.lock"
          commit-message: "chore: update cargo.lock"
          token: ${{ steps.bot-token.outputs.token }}
          branch: chore/cargo-lock-update
          add-paths: |
            Cargo-minimal.lock
            Cargo-recent.lock
