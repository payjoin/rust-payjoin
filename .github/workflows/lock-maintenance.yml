name: Cargo lock maintenance
on:
  schedule:
    - cron: "0 20 * * 0" # weekly at 20:00 UTC
  workflow_dispatch:

jobs:
  update-lock-files:
    runs-on: ubuntu-26.04
    env:
      UPDATE_DEPS: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - run: bash contrib/update-lock-files.sh
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore: update cargo.lock"
          commit-message: "chore: update cargo.lock"
          token: ${{ steps.bot-token.outputs.token }}
          branch: chore/cargo-lock-update
          add-paths: |
            Cargo-minimal.lock
            Cargo-recent.lock
