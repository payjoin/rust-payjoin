name: Native libraries

# Builds the payjoin-ffi native library for each target twice, on separate
# runners from different paths, and fails unless both builds are
# byte-identical.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} (${{ matrix.build }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - aarch64-pc-windows-msvc
          - x86_64-pc-windows-msvc
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
        build: [first, second]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: Set up nix
        uses: $/.github/actions/setup-nix
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          BUILD: ${{ matrix.build }}
        run: |
          set -euo pipefail
          # The second build runs from other paths, with a space in them, so
          # any path that leaks into the library breaks the match. Its own
          # home moves the caches the toolchain keeps there, such as zig's.
          repo=$GITHUB_WORKSPACE
          if [[ $BUILD == second ]]; then
            repo="$RUNNER_TEMP/second build/payjoin"
            mkdir -p "$repo"
            cp -R . "$repo"
            export HOME="$RUNNER_TEMP/second build/home" CARGO_HOME="$RUNNER_TEMP/second build/cargo"
          fi
          shell=native
          if [[ $TARGET == *-android* ]]; then
            shell=native-android
          fi
          nix develop ".#$shell" -c "$repo/contrib/native/build.sh" "$TARGET" "$RUNNER_TEMP/out"
      - name: Upload the library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.build }}-${{ matrix.target }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  compare:
    name: Compare the two builds
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - name: Set up nix
        uses: $/.github/actions/setup-nix
      - name: Download the first build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-first-*
          merge-multiple: true
          path: ${{ runner.temp }}/first
      - name: Download the second build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-second-*
          merge-multiple: true
          path: ${{ runner.temp }}/second
      - name: Compare
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          (cd first && sha256sum -- */*) | tee SHA256SUMS
          (cd second && sha256sum -c ../SHA256SUMS)
      # Both slices just matched, so the file derived from them needs no
      # second build of its own.
      - name: Derive the universal2 macOS library
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/first"
          mkdir -p "$dir/universal2-apple-darwin"
          nix shell --inputs-from . nixpkgs-unstable#llvmPackages_21.llvm -c llvm-lipo -create \
            "$dir/aarch64-apple-darwin/libpayjoin_ffi.dylib" \
            "$dir/x86_64-apple-darwin/libpayjoin_ffi.dylib" \
            -output "$dir/universal2-apple-darwin/libpayjoin_ffi.dylib"
      - name: Upload the libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payjoin-native
          path: ${{ runner.temp }}/first
          if-no-files-found: error
