name: Attach release assets

# Reusable tail of every binding publish workflow: download the packed
# artifact(s), generate SHA256SUMS, and attach everything to the GitHub
# release for the pushed tag. A maintainer's GPG detached signature over
# SHA256SUMS is added out-of-band (locally, then uploaded as
# SHA256SUMS.asc), so no signing key ever reaches a runner.

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: Name (or glob) of the artifact(s) holding the files to attach
        required: true
        type: string
      tag-prefix:
        description: >
          Tag prefix before the version, e.g. payjoin-csharp-. Used to
          derive the version for pre-release detection.
        required: true
        type: string
      archive-globs:
        description: >
          Optional whitespace-separated globs naming which downloaded
          assets are archives to open for member hashing. Required with
          archive-member-globs.
        required: false
        type: string
        default: ""
      archive-member-globs:
        description: >
          Optional whitespace-separated globs of files inside each
          matched archive to hash into SHA256SUMS, so files nested
          inside a package (e.g. native libraries) can be verified
          individually. Required with archive-globs.
        required: false
        type: string
        default: ""

jobs:
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create/update the Release for this tag and upload assets
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ inputs.artifact-pattern }}
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        shell: bash
        env:
          ARCHIVE_GLOBS: ${{ inputs.archive-globs }}
          MEMBER_GLOBS: ${{ inputs.archive-member-globs }}
        run: |
          ./contrib/release/generate-sha256sums.sh dist
          echo "----- SHA256SUMS -----"
          cat dist/SHA256SUMS

      - name: Derive pre-release status from the tag
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          version="${TAG#"$PREFIX"}"
          # SemVer: a hyphen in the version proper marks a pre-release;
          # build metadata after a + never does.
          version="${version%%+*}"
          if [[ $version == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --draft=false
            if [[ "${PRERELEASE}" == "true" ]]; then
              gh release edit "${GITHUB_REF_NAME}" --prerelease
            fi
          else
            args=(--title "Release ${GITHUB_REF_NAME}" --draft=false)
            if [[ "${PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" dist/* "${args[@]}"
          fi
