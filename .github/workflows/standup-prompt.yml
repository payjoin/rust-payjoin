name: Weekly Standup

on:
  schedule:
    # Monday 00:00 UTC = Monday 08:00 Taipei
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to 'true' to gather activity without creating a Discussion"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  create-discussion:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # unneeded: no git auth beyond checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - name: Mint bot token
        id: bot-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-discussions: write
      - run: python .github/scripts/create_standup_discussion.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          STANDUP_TOKEN: ${{ steps.bot-token.outputs.token }}
          BOT_LOGIN: ${{ steps.bot-token.outputs.app-slug }}
          DISCUSSION_CATEGORY_NODE_ID: ${{ secrets.DISCUSSION_CATEGORY_NODE_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
