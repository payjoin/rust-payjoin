[workspace]
resolver = "3"

[package]
name = "payjoin-ffi-wrapper"
description = "This is a simple wrapper crate which re-exports payjoin-ffi for publishing to pub.dev"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[features]
_test-utils = ["payjoin-ffi/_test-utils"]

[lib]
name = "payjoin_ffi_wrapper"
crate-type = ["staticlib", "cdylib"]

[dependencies]
payjoin-ffi = { git = "https://github.com/payjoin/rust-payjoin.git", rev = "60d0adbf4ee8e60090209d55e9864893a4acc30e", features = [
  "dart",
] }
# Not used directly. yoke-derive 0.8.3 needs Rust 1.87 but declares no rust-version,
# so consumers' fresh resolution on the toolchain above picks it. Drop once upstream fixes it.
yoke-derive = "=0.8.2"

[package.metadata.cargo-machete]
ignored = ["yoke-derive"]
