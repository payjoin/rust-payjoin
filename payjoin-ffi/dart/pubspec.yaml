name: payjoin
description: Dart bindings for payjoin
version: 0.26.0
homepage: https://github.com/payjoin/rust-payjoin
repository: https://github.com/payjoin/rust-payjoin

environment:
  sdk: "^3.10.0"

dependencies:
  ffi: ^2.1.4
  hooks: ^2.0.2
  code_assets: ">=1.2.1 <3.0.0"
  native_toolchain_rust: ^1.0.4
dev_dependencies:
  test: ^1.26.2
  http: ^1.4.0

hooks:
  build: hook/build.dart
  # Applies only where this package is the root, that is in the repository.
  # Consumers choose their own mode; see README.md.
  user_defines:
    payjoin:
      build: workspace
